<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Resolve and apply the theme before first paint, to avoid a flash of the
    // wrong theme. Reconciled against the server value once settings load.
    (function () {
      var stored = localStorage.getItem('cal_theme');
      var resolved = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = resolved;
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <!-- FullCalendar (month/week/day views) from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar" title="Hide sidebar">☰</button>
        <h1 class="sidebar-brand">📅 Unified Calendar</h1>
      </div>

      <div class="sidebar-status">
        <div class="status" id="status"><!-- compact connection chips --></div>
        <span class="last-synced" id="last-synced"></span>
      </div>

      <div class="jump-to">
        <select id="jump-month">
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
        <select id="jump-year"><!-- populated by JS --></select>
      </div>

      <button id="sync-btn" class="sync-btn" title="Refresh events from all calendars"><span class="sync-icon">⟳</span><span class="sync-label"> Sync</span></button>

      <h2>Calendars</h2>
      <ul id="calendars" class="cal-list"></ul>
      <button class="new-event-btn hidden" id="new-event-btn">+ New event</button>
      <div class="provider-links">
        <button class="provider-link-btn" id="open-google">Google Calendar ↗</button>
        <button class="provider-link-btn" id="open-outlook">Outlook ↗</button>
      </div>

      <div class="sidebar-footer">
        <a class="settings-link" href="/settings.html">⚙<span class="settings-label"> Settings</span></a>
        <button id="logout-btn" class="logout-btn hidden" title="Sign out">↩</button>
      </div>
    </aside>

    <main>
      <div id="calendar"></div>
    </main>
  </div>

  <!-- Event details modal -->
  <div id="event-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <h3 id="modal-title"></h3>
      <div class="modal-row" id="modal-cal"></div>
      <div class="modal-row" id="modal-time"></div>
      <div class="modal-row" id="modal-location"></div>
      <div class="modal-row modal-guests" id="modal-guests"></div>
      <div class="modal-desc" id="modal-description"></div>
      <a class="modal-open" id="modal-open" href="#" target="_blank" rel="noopener">Open original ↗</a>
      <button class="modal-edit" id="modal-important">★ Mark important</button>
      <button class="modal-edit hidden" id="modal-edit">Edit</button>
    </div>
  </div>

  <!-- Day-view modal (opened by clicking an empty day in month view) -->
  <div id="day-modal" class="modal-overlay hidden">
    <div class="modal day-modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" id="day-modal-close" aria-label="Close">✕</button>
      <h3 id="day-modal-title"></h3>
      <div id="day-calendar"></div>
    </div>
  </div>

  <!-- Event create / edit form modal -->
  <div id="event-form-modal" class="modal-overlay hidden">
    <div class="modal event-form" role="dialog" aria-modal="true" aria-labelledby="ef-heading">
      <button class="modal-close" id="ef-close" aria-label="Close">✕</button>
      <h3 id="ef-heading">New event</h3>
      <form id="ef-form">
        <div class="form-field">
          <label for="ef-title">Title</label>
          <input type="text" id="ef-title" placeholder="Event title" autocomplete="off" required />
        </div>
        <div class="form-field form-field-row">
          <label for="ef-allday">All day</label>
          <input type="checkbox" id="ef-allday" />
        </div>
        <div class="form-field">
          <label for="ef-start">Start</label>
          <input type="datetime-local" id="ef-start" required />
        </div>
        <div class="form-field">
          <label for="ef-end">End</label>
          <input type="datetime-local" id="ef-end" />
        </div>
        <div class="form-field">
          <label for="ef-repeat">Repeat</label>
          <select id="ef-repeat">
            <option value="none">Does not repeat</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
            <option value="yearly">Every year</option>
            <option value="custom" hidden>Custom (kept as is)</option>
          </select>
        </div>
        <div class="form-field hidden" id="ef-until-field">
          <label for="ef-until">Until</label>
          <input type="date" id="ef-until" />
          <small class="field-hint">Leave empty to repeat with no end.</small>
        </div>
        <div class="form-field">
          <label for="ef-cal">Calendar</label>
          <select id="ef-cal"></select>
        </div>
        <div class="form-field" id="ef-guests-field">
          <label for="ef-guests">Guests</label>
          <input type="text" id="ef-guests" placeholder="email@example.com, another@example.com" autocomplete="off" />
          <small class="field-hint" id="ef-guests-hint"></small>
        </div>
        <div class="form-field">
          <label for="ef-loc">Location</label>
          <input type="text" id="ef-loc" placeholder="Optional" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="ef-desc">Description</label>
          <textarea id="ef-desc" rows="3" placeholder="Optional"></textarea>
        </div>
        <div class="ef-actions">
          <button type="button" id="ef-delete" class="danger hidden">Delete</button>
          <div class="ef-actions-right">
            <button type="button" id="ef-cancel">Cancel</button>
            <button type="submit" id="ef-save" class="primary">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Repeating event: apply a change to one occurrence or the whole series -->
  <div id="scope-modal" class="modal-overlay hidden">
    <div class="modal scope-box" role="dialog" aria-modal="true" aria-labelledby="scope-heading">
      <h3 id="scope-heading">Edit repeating event</h3>
      <div class="scope-actions">
        <button type="button" id="scope-this">This event</button>
        <button type="button" id="scope-all" class="primary">All events</button>
        <button type="button" id="scope-cancel">Cancel</button>
      </div>
      <small class="field-hint hidden" id="scope-hint"></small>
    </div>
  </div>

  <!-- Search modal -->
  <div id="search-modal" class="modal-overlay hidden">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Search events or jump to date…" autocomplete="off" spellcheck="false" />
      <ul id="search-results" class="search-results"></ul>
      <div class="search-hint">↑↓ navigate · Enter select · Esc close</div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // A new deploy installs a new worker, which drops the old cache and takes
      // over this page; reload once so the new version shows now rather than on
      // the next launch. Not on the first install (no previous worker), and not
      // while a dialog is open, where a reload would lose what was typed.
      const hadWorker = Boolean(navigator.serviceWorker.controller);
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadWorker || reloading) return;
        if (document.querySelector('.modal-overlay:not(.hidden)')) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
